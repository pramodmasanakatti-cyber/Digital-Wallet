spring:
  application:
    name: Digital-Wallet
  profiles:
    active: dev

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
      root: INFO
      com.digitalwallet.controller: DEBUG
      com.digitalwallet.service: DEBUG
      com.digitalwallet.repository: INFO
      com.digitalwallet.mapper: DEBUG
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE

  pattern:
      file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: "logs/application.log"
user-service:
  base-url: http://localhost:8081
jwt:
  secret: ThisIsTheSecretKeyForDigitalWalletProject1234